<title>PlantAI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>
/* Композиция: липкая шапка, крупный заголовок слева и «лабораторная» композиция из растений справа, ниже карточки на светлом молочном фоне. */
:root{
  --bg:#FAFAF7; --surface:#FFFFFF; --soft:#E8F5E9; --ink:#1F2624; --muted:#5B6662; --line:#E2E6DF;
  --accent:#145A43; --accent-ink:#FFFFFF; --accent-rgb:20,90,67;
  --good-rgb:31,138,95; --warn-rgb:176,112,20; --bad-rgb:192,57,43;
  --good:rgb(var(--good-rgb)); --warn:rgb(var(--warn-rgb)); --bad:rgb(var(--bad-rgb));
  --good-bg:rgba(var(--good-rgb),.12); --warn-bg:rgba(var(--warn-rgb),.12); --bad-bg:rgba(var(--bad-rgb),.1);
  --nav-bg:rgba(250,250,247,.82);
  --shadow:0 1px 2px rgba(20,40,30,.05),0 8px 24px rgba(20,40,30,.06);
  --shadow-lg:0 2px 4px rgba(20,40,30,.06),0 28px 64px rgba(20,60,45,.14);
  --glow:rgba(255,255,255,.75); --pot:#DCE3DB; --pot-rim:#C7D1C6; --pot-shadow:rgba(20,40,30,.1);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --soft:#1B2B23; --ink:#E9F0EC; --muted:#98A8A0; --line:#26352D;
  --accent:#5CC49A; --accent-ink:#062117; --accent-rgb:92,196,154;
  --good-rgb:76,195,138; --warn-rgb:224,168,75; --bad-rgb:239,122,107;
  --nav-bg:rgba(14,21,18,.82);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 28px 64px rgba(0,0,0,.45);
  --glow:rgba(255,255,255,.05); --pot:#33443A; --pot-rim:#41554A; --pot-shadow:rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --soft:#1B2B23; --ink:#E9F0EC; --muted:#98A8A0; --line:#26352D;
  --accent:#5CC49A; --accent-ink:#062117; --accent-rgb:92,196,154;
  --good-rgb:76,195,138; --warn-rgb:224,168,75; --bad-rgb:239,122,107;
  --nav-bg:rgba(14,21,18,.82);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 28px 64px rgba(0,0,0,.45);
  --glow:rgba(255,255,255,.05); --pot:#33443A; --pot-rim:#41554A; --pot-shadow:rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--nav-bg);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.12rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.94rem;white-space:nowrap;display:flex;gap:7px;align-items:center}
.nav a:hover{color:var(--ink);background:var(--soft)}
.nav a[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:600}
@media(max-width:760px){.nav{margin-left:0;width:100%}.bar{gap:4px}}

/* страница */
.page{padding-block:20px 72px;animation:rise .45s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.display{font-size:clamp(2.8rem,7vw,5rem);line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:14px 0 20px}
.display span{display:block;margin-top:12px;color:var(--accent);font-weight:600;font-size:clamp(1.45rem,3.3vw,2.15rem);letter-spacing:-.02em;line-height:1.15}
.lead{font-size:1.14rem;color:var(--muted);max-width:34em}
.h2{font-size:clamp(1.8rem,3.6vw,2.6rem);line-height:1.1;letter-spacing:-.03em;font-weight:700}
.sub{color:var(--muted);margin-top:10px;max-width:42em}
.section-head{padding-block:28px 24px}
.latin{font-family:var(--serif);font-style:italic;color:var(--muted)}

/* кнопки и элементы форм */
.btn{border:1px solid transparent;border-radius:999px;padding:11px 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;line-height:1.2;transition:transform .15s,box-shadow .2s,background .2s;background:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{box-shadow:0 8px 24px rgba(var(--accent-rgb),.3)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--bad);border-color:rgba(var(--bad-rgb),.5)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.lg{padding:14px 26px;font-size:1.02rem}
.btn.sm{padding:6px 14px;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.field{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
select.field{width:auto;max-width:100%}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* карточки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px;min-width:0}
.card.soft{background:var(--soft);box-shadow:none;border-color:transparent}
.card h3{font-size:1.2rem;letter-spacing:-.015em;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:860px){.grid3,.two{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* главная */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center;padding-block:36px 52px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.status-line{display:flex;align-items:center;gap:8px;margin-top:22px;font-size:.9rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}
.status-line.on .dot{background:var(--good)}
.hero-art{position:relative;aspect-ratio:1/1;border-radius:36px;background:radial-gradient(120% 90% at 28% 8%,var(--soft),var(--surface));border:1px solid var(--line);box-shadow:var(--shadow-lg);overflow:hidden}
.hero-art .p{position:absolute;display:block}
.hero-art .p1{width:42%;left:1%;bottom:7%}
.hero-art .p3{width:42%;right:0;bottom:9%}
.hero-art .p2{width:72%;left:14%;bottom:3%}
.scan{position:absolute;left:25%;top:9%;width:50%;height:68%;pointer-events:none}
.scan i{position:absolute;width:28px;height:28px;border:3px solid var(--accent);border-radius:6px}
.scan i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.scan i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.scan i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.scan i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.scan b{position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 3.4s ease-in-out infinite alternate}
@keyframes scan{from{top:6%}to{top:94%}}
@media(max-width:860px){.hero{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:20px 36px}.hero-art{aspect-ratio:1/.92}}
.step-n{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;margin-bottom:14px}
.banner{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px}

/* диагностика */
.drop{border:2px dashed var(--line);border-radius:20px;min-height:300px;display:grid;place-items:center;background:var(--bg);overflow:hidden;padding:12px;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--accent);background:var(--soft)}
.drop.has{border-style:solid}
.drop img{max-width:100%;max-height:420px;border-radius:12px;display:block}
.drop-empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);padding:24px}
.drop-empty strong{color:var(--ink)}
.big-result{font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.025em;line-height:1.15;font-weight:700}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 58px;gap:10px;align-items:center;font-size:.9rem}
.brow .t{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.brow .t>i{display:block;height:100%;border-radius:99px}
.brow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
@media(max-width:480px){.brow{grid-template-columns:minmax(0,1fr) 54px}.brow .t{grid-column:1/-1;order:3}}
.note{border-radius:14px;padding:13px 16px;display:flex;gap:12px;align-items:flex-start;border:1px solid transparent;font-size:.93rem}
.note>svg{flex:none;margin-top:2px}
.note.warn{background:var(--warn-bg);border-color:rgba(var(--warn-rgb),.3)}
.note.bad{background:var(--bad-bg);border-color:rgba(var(--bad-rgb),.3)}
.note.good{background:var(--good-bg);border-color:rgba(var(--good-rgb),.3)}
.note.info{background:var(--soft)}
.recs{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
details>summary{cursor:pointer;font-weight:600;padding-block:6px}
details ol{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;background:var(--soft);padding:1px 6px;border-radius:6px}
.maprow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center}
@media(max-width:560px){.maprow{grid-template-columns:minmax(0,1fr)}}

/* каталог */
.search{position:relative;flex:1 1 280px;min-width:0}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .field{padding-left:42px;border-radius:999px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-top:22px}
.pc{padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.pc:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.pc-art{aspect-ratio:1/.86;display:grid;place-items:center;background:radial-gradient(100% 80% at 50% 15%,var(--soft),transparent 85%),var(--bg);border-bottom:1px solid var(--line)}
.pc-art svg{width:82%;height:auto;display:block}
.pc-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.pc-body h3{margin:0;font-size:1.12rem;letter-spacing:-.015em}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}

/* лаборатория */
.kpis{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
@media(max-width:560px){.kpis{grid-template-columns:minmax(0,1fr);justify-items:center}}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.nums div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.nums b{display:block;font-size:1.6rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.nums span{font-size:.8rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:700px;font-size:.92rem}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;display:block}
.mx{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:6px;font-size:.82rem;align-items:stretch}
.mx .h{color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.mx .h.l{justify-content:flex-start;text-align:left}
.mx .c{border-radius:10px;display:grid;place-items:center;padding:14px 4px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--bg);border:1px solid var(--line)}
.csv{width:100%;min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;resize:vertical}

footer{border-top:1px solid var(--line);padding-block:28px 40px;color:var(--muted);font-size:.9rem}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

function speciesKey(label) {
  var x=String(label||'').toLowerCase().replace(/[^a-z]/g,'');
  if(x.indexOf('spathiphyllum')>=0)return 'Spathiphyllum';
  if(x.indexOf('chlorophytum')>=0)return 'Chlorophytum';
  if(x.indexOf('ficus')>=0)return 'Ficus_benjamina';
  if(x.indexOf('tomato')>=0)return 'Tomato';
  return '';
}
function useSpeciesModel() {
  var st=useState({status:'loading',error:''}),state=st[0],setState=st[1];
  var ref=useRef(null);
  useEffect(function(){
    var active=true;
    loadLibs().then(function(){return window.tmImage.load(SPECIES_URL+'model.json',SPECIES_URL+'metadata.json');})
    .then(function(m){if(active){ref.current=m;setState({status:'ready',error:''});}})
    .catch(function(){if(active)setState({status:'error',error:'Не удалось подключить модель распознавания растений. Проверьте интернет.'});});
    return function(){active=false;};
  },[]);
  function predict(el){
    if(!ref.current)return Promise.reject(new Error('species not ready'));
    var c=document.createElement('canvas');c.width=c.height=224;
    var w=el.naturalWidth||el.width,h=el.naturalHeight||el.height,side=Math.min(w,h);
    c.getContext('2d').drawImage(el,(w-side)/2,(h-side)/2,side,side,0,0,224,224);
    return ref.current.predict(c).then(function(arr){
      var all=arr.map(function(x){return {label:x.className,key:speciesKey(x.className),prob:x.probability};}).sort(function(a,b){return b.prob-a.prob;});
      return {top:all[0],all:all};

  }

function Diagnosis(p){
 var m=p.model,species=p.species;
 var s1=useState(''),src=s1[0],setSrc=s1[1];
 var s2=useState(false),busy=s2[0],setBusy=s2[1];
 var s3=useState(null),result=s3[0],setResult=s3[1];
 var s4=useState(''),err=s4[0],setErr=s4[1];
 var inp=useRef(null);
 function pick(f){
  if(!f)return;
  if(!/^image\//.test(f.type)){setErr('Выберите фотографию JPG, PNG или WebP.');return;}
  setResult(null);setErr('');readFile(f).then(setSrc,function(){setErr('Не удалось открыть фото.');});
 }
 function run(){
  if(!src||busy)return;
  setBusy(true);setResult(null);setErr('');
  loadImg(src).then(function(img){
   // Модель комнатных растений распознаёт 3 вида, модель вида - ещё 4.
   // Проверяем обе, но загружаем их только один раз; результат с наиболее
   // уверенным совпадением нельзя сравнивать между моделями напрямую.
   // Поэтому сначала определяем вид по модели видов, а отдельно проверяем
   // новые виды по специализированной модели. Для сансевиерии и Money Plant
   // отдельная модель является единственным источником идентификации.
   return Promise.all([species.predict(img),indoorPredict(img)]).then(function(arr){
    var sp=arr[0].top,ind=arr[1],meta=indoorLabel(ind.className);
    var isSpider=sp.key==='Chlorophytum';
    var useIndoor=false;
    // Если базовая модель распознаёт хлорофитум, применяем диагноз для него.
    if(isSpider && meta && meta[0]==='Хлорофитум')useIndoor=true;
    // Новые виды отсутствуют в модели видов. Они могут быть предложены
    // специализированной моделью, только при достаточно сильном ответе.
    if(meta && (meta[0]==='Сансевиерия'||meta[0]==='Эпипремнум золотистый') && ind.probability>=0.90)useIndoor=true;
    if(useIndoor){
      setResult({name:meta[0],condition:meta[1],tips:CARE_TIPS[meta[2]]||[],kind:'indoor'});
    } else if(sp.key==='Tomato' && sp.prob>=0.65 && m.ready){
      return m.predict(img).then(function(r){
       var label=r.top.label.toLowerCase();
       var state=/early/.test(label)?'Альтернариоз':/late/.test(label)?'Фитофтороз':'Здоровый лист';
       var tip=/early|late/.test(label)?['Осмотрите листья с обеих сторон.','Улучшите вентиляцию и избегайте намокания листвы.']:['Поддерживайте регулярный уход.','Наблюдайте за состоянием листьев.'];
       setResult({name:'Томат',condition:state,tips:tip,kind:'tomato'});
      });
    } else {
      setResult({name:SPECIES_NAMES[sp.key]||sp.label,condition:'',tips:[],kind:'species'});
    }
   });
  }).catch(function(){setErr('Не удалось завершить анализ. Проверьте интернет и повторите попытку.');})
    .then(function(){setBusy(false);});
 }
 var view=busy?html`<div className="row"><div className="spin"></div><p>Анализируем фотографию…</p></div>`:
  result?html`<div className="stack" style=${{gap:15}}>
   <span className="chip good">Результат</span>
   <p className="big-result" style=${{fontSize:'clamp(2rem,4vw,3.2rem)',lineHeight:1.1}}>${result.name}</p>
   ${result.condition?html`<h3 style=${{fontSize:'1.35rem'}}>${result.condition}</h3>`:null}
   ${result.tips.length?html`<div className="stack"><h4>Рекомендации по уходу</h4><ul className="recs">${result.tips.map(function(t,i){return html`<li key=${i}>${t}</li>`;})}</ul></div>`:null}
   <p className="muted small">Результат автоматического распознавания по фотографии.</p>
  </div>`:html`<p className="muted">Загрузите фото растения и нажмите «Проверить».</p>`;
 return html`<div>
  <div className="section-head"><p className="eyebrow">PlantAI Vision</p><h1 className="h2" style=${{marginTop:8}}>Проверка растения</h1><p className="sub">Одно фото — название растения, признаки состояния и рекомендации.</p></div>
  <div className="two">
   <section className="card stack">
    <div className=${'drop'+(src?' has':'')} onDragOver=${function(e){e.preventDefault();}} onDrop=${function(e){e.preventDefault();pick(e.dataTransfer.files[0]);}}>
     ${src?html`<img src=${src} alt="Фотография растения" />`:html`<div className="drop-empty"><${Icon} name="upload" size=${34}/><strong>Загрузите фото листа</strong><span>JPG, PNG, WebP</span></div>`}
    </div>
    <input ref=${inp} type="file" accept="image/*" hidden onChange=${function(e){pick(e.target.files[0]);}} />
    <div className="row"><button className="btn ghost" onClick=${function(){inp.current&&inp.current.click();}}>Выбрать фото</button>
    <button className="btn primary" disabled=${!src||busy||!species.ready} onClick=${run}>${busy?'Анализ…':'Проверить'}</button></div>
    ${err?html`<${Notice} tone="bad">${err}<//>`:null}
   </section>
   <section className="card" aria-live="polite"><h3>Результат</h3>${view}</section>
  </div>
 </div>`;
}

function Lab(p) {
  var m = p.model, rows = p.rows, setRows = p.setRows;
  var s1 = useState(''), truth = s1[0], setTruth = s1[1];
  var s2 = useState([]), files = s2[0], setFiles = s2[1];
  var s3 = useState([]), urls = s3[0], setUrls = s3[1];
  var s4 = useState(false), busy = s4[0], setBusy = s4[1];
  var s5 = useState(null), msg = s5[0], setMsg = s5[1];
  var s6 = useState(false), showCsv = s6[0], setShowCsv = s6[1];
  var s7 = useState(false), confirmClear = s7[0], setConfirmClear = s7[1];
  var inp = useRef(null), csvRef = useRef(null);
  var st = useMemo(function () { return stats(rows); }, [rows]);
  var csv = useMemo(function () { return toCSV(rows); }, [rows]);
  var canPredict = m.ready && m.mapped;

  useEffect(function () {
    var u = files.slice(0, 8).map(function (f) { return URL.createObjectURL(f); }); setUrls(u);
    return function () { u.forEach(function (x) { URL.revokeObjectURL(x); }); };
  }, [files]);

  function onFiles(e) { setFiles(Array.prototype.slice.call(e.target.files).filter(function (f) { return /^image\//.test(f.type); })); setMsg(null); }

  function add() {
    if (!files.length || !truth) return;
    setBusy(true); setMsg(null);
    var made = [], failed = 0, noPred = 0;
    var chain = Promise.resolve();
    files.forEach(function (f) {
      chain = chain.then(function () {
        return squareThumb(f).then(function (thumb) {
          var rec = { id: uid(), ts: Date.now(), thumb: thumb, truth: truth, pred: null, conf: null };
          if (!canPredict) { made.push(rec); return; }
          return loadImg(thumb).then(function (img) { return m.predict(img); }).then(function (r) {
            if (r.top.cat) { rec.pred = r.top.cat; rec.conf = r.top.prob; } else noPred++;
          }, function () { noPred++; }).then(function () { made.push(rec); });
        }, function () { failed++; });
      });
    });
    chain.then(function () {
      setRows(function (prev) { return prev.concat(made); });
      setFiles([]); if (inp.current) inp.current.value = ''; setBusy(false);
      var text = 'Добавлено фотографий: ' + made.length + '.';
      if (!canPredict && made.length) text += ' Прогноз не сохранён: модель ИИ не подключена.';
      if (noPred) text += ' Для ' + noPred + ' фото не удалось получить прогноз.';
      if (failed) text += ' Не удалось прочитать файлов: ' + failed + '.';
      setMsg({ tone: failed || noPred || !canPredict ? 'warn' : 'good', text: text });
    });
  }

  function predictRows(onlyMissing) {
    if (!canPredict) return;
    setBusy(true); setMsg(null);
    var upd = {}, chain = Promise.resolve();
    rows.forEach(function (r) {
      if (onlyMissing && r.pred) return;
      chain = chain.then(function () { return loadImg(r.thumb).then(function (img) { return m.predict(img); }).then(function (o) { if (o.top.cat) upd[r.id] = { pred: o.top.cat, conf: o.top.prob }; }, function () { }); });
    });
    chain.then(function () {
      var n = Object.keys(upd).length;
      setRows(function (prev) { return prev.map(function (r) { return upd[r.id] ? Object.assign({}, r, upd[r.id]) : r; }); });
      setBusy(false); setMsg({ tone: 'good', text: 'Прогнозы получены: ' + n + '.' });
    });
  }
  function setRowTruth(id, v) { setRows(function (prev) { return prev.map(function (r) { return r.id === id ? Object.assign({}, r, { truth: v }) : r; }); }); }
  function del(id) { setRows(function (prev) { return prev.filter(function (r) { return r.id !== id; }); }); }

  function download() {
    saveFile('plantai-experiment.csv', csv).then(function (r) {

      else setMsg({ tone: 'bad', text: 'Не удалось сохранить файл. Скопируйте данные из поля ниже.' });
    });
  }
  function copy() {
    var ok = function () { setMsg({ tone: 'good', text: 'CSV скопирован в буфер обмена. Вставьте его в Excel или Google Таблицы.' }); };
    var fb = function () { setShowCsv(true); setMsg({ tone: 'warn', text: 'Не удалось скопировать автоматически. Выделите текст в поле ниже и скопируйте вручную.' }); setTimeout(function () { csvRef.current && csvRef.current.select(); }, 50); };
    try { navigator.clipboard.writeText(csv).then(ok, fb); } catch (e) { fb(); }
  }

  var maxCell = Math.max.apply(null, [1].concat([].concat.apply([], st.mat)));
  var noPredCount = rows.filter(function (r) { return !r.pred; }).length;

  return html`<div>

    <div className="two">

        <div><span className="small" style=${{ fontWeight: 600 }}>1. Правильная категория</span>

        ${!m.ready ? html`<${Notice} tone="warn" icon="cpu"><strong>Для анализа подключите ИИ-модель</strong><br />Фото сохранятся без прогноза. Подключите модель, и прогнозы можно будет получить кнопкой «Прогнать».<div style=${{ marginTop: 8 }}><button className="btn ghost sm" onClick=${p.onSetup}>Настроить модель</button></div><//>` : (!m.mapped ? html`<${Notice} tone="warn" icon="alert">Сопоставьте классы модели с категориями в разделе «Проверка растения».<div style=${{ marginTop: 8 }}><button className="btn ghost sm" onClick=${p.onSetup}>Открыть настройки</button></div><//>` : null)}
        <div className="row"><button className="btn primary" disabled=${!files.length || !truth || busy} onClick=${add}><${Icon} name="check" size=${18} />${busy ? 'Обработка…' : (canPredict ? 'Проверить моделью и сохранить' : 'Сохранить без прогноза')}</button></div>
        ${msg ? html`<${Notice} tone=${msg.tone} icon=${msg.tone === 'good' ? 'check' : 'info'}>${msg.text}<//>` : null}
      </section>

      <section className="card stack" aria-label="Точность">
        <h3 style=${{ margin: 0 }}>Точность модели</h3>
        <div className="kpis">
          <${Ring} value=${st.acc} />
          <div className="nums"><div><b>${st.total}</b><span>всего проверок</span></div><div><b>${st.n}</b><span>с прогнозом ИИ</span></div><div><b>${st.ok}</b><span>совпало</span></div></div>
        </div>
        <p className="muted small">Точность = совпавшие прогнозы ÷ проверки с прогнозом. Достоверность результата оценивается на отложенных проверочных фотографиях; нельзя использовать обучающие снимки для итоговой оценки.</p>
      </section>
    </div>

    <div className="two" style=${{ marginTop: 24 }}>
      <section className="card stack" aria-label="Точность по категориям">
        <h3 style=${{ margin: 0 }}>Точность по категориям</h3>
        ${st.per.map(function (r) { return html`<div key=${r.key} className="stack" style=${{ gap: 6 }}>
          <div className="row" style=${{ justifyContent: 'space-between' }}><span>${CAT[r.key].name}</span><strong style=${{ fontVariantNumeric: 'tabular-nums' }}>${r.total ? r.ok + ' из ' + r.total + ' · ' + pct(r.acc) : 'нет данных'}</strong></div>
          <div className="meter"><i style=${{ width: (r.acc == null ? 0 : r.acc * 100) + '%', background: CAT[r.key].color }}></i></div></div>`; })}
      </section>
      <section className="card" aria-label="Матрица ошибок">
        <h3>Сравнение: правильный ответ и прогноз ИИ</h3>
        <div className="mx" role="table" aria-label="Матрица ошибок: строки — правильная категория, столбцы — прогноз ИИ">
          <div className="h l">Правильно ↓ / Прогноз →</div>${CATS.map(function (c) { return html`<div className="h" key=${c.key}>${c.short}</div>`; })}
          ${CATS.map(function (a, i) { return html`<${React.Fragment} key=${a.key}><div className="h l">${a.short}</div>${CATS.map(function (b, j) {
            var n = st.mat[i][j], diag = i === j, rgb = diag ? 'var(--good-rgb)' : 'var(--bad-rgb)';
            return html`<div key=${b.key} className="c" style=${n ? { background: 'rgba(' + (diag ? 'var(--good-rgb)' : 'var(--bad-rgb)') + ',' + (0.14 + 0.5 * n / maxCell).toFixed(2) + ')' } : null}>${n}</div>`; })}<//>`; })}
        </div>
        <p className="muted small" style=${{ marginTop: 12 }}>Зелёные клетки по диагонали — верные прогнозы, красные — ошибки.</p>
      </section>
    </div>

    <section style=${{ marginTop: 24 }} aria-label="Таблица эксперимента">
      <div className="row" style=${{ justifyContent: 'space-between', marginBottom: 14 }}>
        <h2 style=${{ fontSize: '1.5rem', letterSpacing: '-.02em' }}>Таблица эксперимента</h2>
        <div className="row">
          ${canPredict && noPredCount ? html`<button className="btn ghost sm" disabled=${busy} onClick=${function () { predictRows(true); }}>Прогнать без прогноза (${noPredCount})</button>` : null}
          ${canPredict && rows.length ? html`<button className="btn ghost sm" disabled=${busy} onClick=${function () { predictRows(false); }}>Пересчитать все</button>` : null}
          <button className="btn primary sm" disabled=${!rows.length} onClick=${download}><${Icon} name="download" size=${16} />Скачать CSV</button>
          <button className="btn ghost sm" disabled=${!rows.length} onClick=${copy}><${Icon} name="copy" size=${16} />Копировать CSV</button>
          <button className="btn ghost sm" disabled=${!rows.length} onClick=${function () { setShowCsv(!showCsv); }}>${showCsv ? 'Скрыть CSV' : 'Показать CSV'}</button>
        </div>
      </div>
      ${rows.length ? html`<div className="tbl-wrap"><table>
        <thead><tr><th>№</th><th>Фото</th><th>Дата</th><th>Правильная категория</th><th>Прогноз ИИ</th><th>Уверенность</th><th>Результат</th><th><span style=${{ position: 'absolute', left: '-9999px' }}>Действия</span></th></tr></thead>
        <tbody>${rows.map(function (r, i) { return html`<tr key=${r.id}>
          <td className="num">${i + 1}</td>
          <td><img className="thumb" src=${r.thumb} alt=${'Проверочное фото ' + (i + 1)} /></td>
          <td className="num muted">${fmtDate(r.ts)}</td>
          <td><select id=${'truth-' + r.id} className="field" aria-label=${'Правильная категория, строка ' + (i + 1)} value=${r.truth} onChange=${function (e) { setRowTruth(r.id, e.target.value); }}>${CATS.map(function (c) { return html`<option key=${c.key} value=${c.key}>${c.name}</option>`; })}</select></td>
          <td>${r.pred ? CAT[r.pred].name : html`<span className="muted">Нет прогноза</span>`}</td>
          <td className="num">${pct(r.conf)}</td>
          <td>${r.pred ? (r.pred === r.truth ? html`<span className="chip good"><${Icon} name="check" size=${14} />Совпало</span>` : html`<span className="chip bad"><${Icon} name="x" size=${14} />Ошибка</span>`) : (canPredict ? html`<button className="btn ghost sm" disabled=${busy} onClick=${function () { predictRows(true); }}>Прогнать</button>` : html`<span className="chip mute">Ожидает</span>`)}</td>
          <td><button className="btn ghost sm" aria-label=${'Удалить строку ' + (i + 1)} onClick=${function () { del(r.id); }}><${Icon} name="trash" size=${16} /></button></td></tr>`; })}</tbody></table></div>`
      : html`<div className="card empty"><${Icon} name="flask" size=${34} /><p style=${{ marginTop: 10, fontWeight: 600, color: 'var(--ink)' }}>Таблица пока пуста</p><p className="small" style=${{ maxWidth: '34em', margin: '6px auto 0' }}>Выберите правильную категорию, загрузите проверочные фотографии и нажмите «Проверить моделью и сохранить». Строки появятся здесь, а точность и графики посчитаются сами.</p></div>`}
      ${showCsv && rows.length ? html`<div style=${{ marginTop: 14 }}><label htmlFor="csv-text" className="small muted">Данные CSV (разделитель — точка с запятой, открывается в Excel и Google Таблицах)</label><textarea id="csv-text" ref=${csvRef} className="field csv" readOnly value=${csv} style=${{ marginTop: 6 }}></textarea></div>` : null}
      ${rows.length ? html`<div className="row" style=${{ marginTop: 14 }}>
        ${confirmClear ? html`<span className="small">Удалить все ${rows.length} строк?</span><button className="btn danger sm" onClick=${function () { setRows([]); setConfirmClear(false); setShowCsv(false); setMsg(null); }}>Да, удалить</button><button className="btn ghost sm" onClick=${function () { setConfirmClear(false); }}>Отмена</button>`
        : html`<button className="btn ghost sm" onClick=${function () { setConfirmClear(true); }}><${Icon} name="trash" size=${16} />Очистить данные</button>`}</div>` : null}
    </section>
  </div>`;
}

/* ============ О ПРОЕКТЕ ============ */
var ABOUT = [
 ['sun','Освещение',['Выбирайте яркий или рассеянный свет в зависимости от вида растения.','Некоторые растения могут получить ожоги под прямыми солнечными лучами.']],
 ['drop','Полив',['Перед поливом проверяйте верхние 2–3 см почвы.','Не оставляйте лишнюю воду в поддоне.']],
 ['leaf','Уход за листьями',['Аккуратно удаляйте пыль мягкой влажной тканью.','Регулярно осматривайте листья на наличие пятен и вредителей.']],
 ['shield','Важно знать',['Результат ИИ — предположение по фотографии, а не точный диагноз.','Проверяйте также почву, корни и условия содержания растения.']]
];
function About(p) {
  return html`<div>
    <div className="section-head"><p className="eyebrow">Рекомендации</p><h1 className="h2" style=${{ marginTop: 8 }}>Советы по уходу</h1><p className="sub">Простые рекомендации, которые помогут вашим растениям чувствовать себя лучше.</p></div>
    <div className="grid3" style=${{ gridTemplateColumns: 'repeat(auto-fit,minmax(min(100%,300px),1fr))' }}>
      ${ABOUT.map(function (a) { return html`<article className="card" key=${a[1]}>
        <div className="step-n" style=${{ borderRadius: 12 }}><${Icon} name=${a[0]} size=${19} /></div>
        <h3>${a[1]}</h3>${a[2].map(function (t, i) { return html`<p className="muted" key=${i} style=${{ marginTop: i ? 10 : 0 }}>${t}</p>`; })}</article>`; })}
    </div>
    <section className="card soft banner" style=${{ marginTop: 24 }}>
      <div style=${{ minWidth: 0, maxWidth: '36em' }}><h3 style=${{ fontSize: '1.3rem' }}>Позаботьтесь о своём растении</h3><p className="muted">Загрузите фотографию и получите полезные советы по уходу.</p></div>
      <div className="row"><button className="btn primary" onClick=${function () { p.go('diagnosis'); }}>Проверить растение</button></div>
    </section>
  </div>`;
}


/* ============ ЛИЧНЫЙ ДНЕВНИК И ПЛАН УХОДА ============ */
function MyPlants() {
  var initial = function () { return store.get('plantai.personal.v1', []); };
  var a = useState(initial), plants = a[0], setPlants = a[1];
  var b = useState(''), name = b[0], setName = b[1];
  var c = useState(''), species = c[0], setSpecies = c[1];
  var d = useState(''), active = d[0], setActive = d[1];
  var e = useState(''), light = e[0], setLight = e[1];
  var f = useState(''), soil = f[0], setSoil = f[1];
  var g = useState(''), condition = g[0], setCondition = g[1];
  var j = useState(''), note = j[0], setNote = j[1];
  var k = useState(''), photo = k[0], setPhoto = k[1];
  var z = useState(''), message = z[0], setMessage = z[1];
  useEffect(function () { if (!store.set('plantai.personal.v1', plants)) setMessage('Память браузера заполнена. Сохраните резервную копию.'); }, [plants]);
  var current = plants.find(function(p){return p.id===active;}) || plants[0];
  function addPlant() {
    if (!name.trim() || !species) {setMessage('Укажите название и вид растения.');return;}
    var id=uid();setPlants(function(old){return old.concat([{id:id,name:name.trim(),species:species,entries:[]}]);});setActive(id);setName('');setMessage('Растение добавлено.');
  }
  function fileChange(ev) {
    var file=ev.target.files && ev.target.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)){setMessage('Нужно изображение JPG или PNG.');return;}
    squareThumb(file,420).then(setPhoto,function(){setMessage('Не удалось прочитать фотографию.');});
  }
  function saveEntry(){
    if(!current){setMessage('Сначала добавьте растение.');return;}
    if(!photo){setMessage('Добавьте фотографию для дневника.');return;}
    if(!condition){setMessage('Укажите состояние растения.');return;}
    var entry={id:uid(),ts:Date.now(),photo:photo,light:light,soil:soil,condition:condition,note:note.trim()};
    setPlants(function(old){return old.map(function(p){return p.id===current.id?Object.assign({},p,{entries:p.entries.concat([entry])}):p;});});
    setPhoto('');setNote('');setCondition('');setMessage('Наблюдение сохранено.');
  }
  function removeEntry(id){setPlants(function(old){return old.map(function(p){return p.id===current.id?Object.assign({},p,{entries:p.entries.filter(function(x){return x.id!==id;})}):p;});});}
  function carePlan(){
    if(!current)return [];
    var sp=PLANTS.find(function(p){return p.ru===current.species;});
    var arr=[sp?sp.tip:'Уточните особенности ухода за вашим видом растения.'];
    if(soil==='dry')arr.push('Почва сухая: проверьте глубину просыхания и потребность именно этого вида в поливе.');
    if(soil==='wet')arr.push('Почва влажная: не поливайте повторно, проверьте дренаж и отсутствие застоя воды.');
    if(light==='direct')arr.push('При прямом солнце следите за ожогами листьев; освещение подбирайте по виду.');
    if(light==='low')arr.push('При слабом освещении оцените, достаточно ли света этому виду.');
    if(condition==='worse')arr.push('Если состояние ухудшается, осмотрите обе стороны листьев, стебель и корни.');
    arr.push('Повторите фото с того же ракурса через 2–3 дня, чтобы сравнить изменения.');
    return arr;
  }
  var entries=current?current.entries.slice().sort(function(a,b){return a.ts-b.ts;}):[];
  var first=entries.length>1?entries[0]:null, last=entries.length>1?entries[entries.length-1]:null;
  return html`<div>
    <div className="section-head"><p className="eyebrow">Персональное пространство</p><h1 className="h2" style=${{marginTop:8}}>Мои растения</h1><p className="sub">Дневник здоровья, персональный план ухода и контроль изменений — в одном месте.</p></div>
    <div className="two">
      <section className="card stack"><h3>Добавить растение</h3>
        <label>Имя растения<input className="field" value=${name} placeholder="Например, Мой спатифиллум" onChange=${function(e){setName(e.target.value);}} /></label>
        <label>Вид растения<select className="field" style=${{width:'100%'}} value=${species} onChange=${function(e){setSpecies(e.target.value);}}><option value="">Выберите из каталога</option>${PLANTS.map(function(p){return html`<option key=${p.id} value=${p.ru}>${p.ru}</option>`;})}</select></label>
        <button className="btn primary" onClick=${addPlant}>Добавить в коллекцию</button>
      </section>
      <section className="card stack"><h3>Ваша коллекция</h3>
        ${plants.length?html`<div className="seg">${plants.map(function(p){return html`<button key=${p.id} aria-pressed=${current&&current.id===p.id} onClick=${function(){setActive(p.id);setMessage('');}}>${p.name} · ${p.entries.length} фото</button>`;})}</div>`:html`<p className="muted">Добавьте первое растение, чтобы начать наблюдение.</p>`}
        ${current?html`<p className="muted small">Выбрано: <strong>${current.name}</strong> · ${current.species}</p>`:null}
      </section>
    </div>
    ${message?html`<div style=${{marginTop:14}}><${Notice} tone="info">${message}<//></div>`:null}
    ${current?html`<div className="two" style=${{marginTop:24}}>
      <section className="card stack"><h3>Дневник здоровья</h3><p className="muted small">Добавьте новый снимок и условия ухода. Фото и записи сохраняются в этом браузере.</p>
        <label>Фотография<input className="field" type="file" accept="image/*" onChange=${fileChange} /></label>
        ${photo?html`<img src=${photo} alt="Новое фото растения" style=${{width:'100%',maxHeight:240,objectFit:'contain',borderRadius:16}}/>`:null}
        <label>Освещение<select className="field" style=${{width:'100%'}} value=${light} onChange=${function(e){setLight(e.target.value);}}><option value="">Не указано</option><option value="direct">Прямое солнце</option><option value="diffuse">Рассеянный свет</option><option value="low">Слабое освещение</option></select></label>
        <label>Состояние почвы<select className="field" style=${{width:'100%'}} value=${soil} onChange=${function(e){setSoil(e.target.value);}}><option value="">Не проверено</option><option value="dry">Сухая</option><option value="normal">Умеренно влажная</option><option value="wet">Очень влажная</option></select></label>
        <label>Состояние растения<select className="field" style=${{width:'100%'}} value=${condition} onChange=${function(e){setCondition(e.target.value);}}><option value="">Выберите состояние</option><option value="good">Выглядит здоровым</option><option value="same">Без изменений</option><option value="better">Стало лучше</option><option value="worse">Стало хуже</option></select></label>
        <label>Заметка<textarea className="field" rows="2" placeholder="Что изменилось после полива?" value=${note} onChange=${function(e){setNote(e.target.value);}}></textarea></label>
        <button className="btn primary" onClick=${saveEntry}>Сохранить наблюдение</button>
      </section>
      <section className="card stack"><h3>Умный план ухода</h3><p className="muted small">Рекомендации подбираются по виду растения и введённым условиям. Это правила ухода, а не новый ИИ-диагноз.</p>
        <ul className="recs">${carePlan().map(function(t,i){return html`<li key=${i}>${t}</li>`;})}</ul>
        <h3 style=${{marginTop:14}}>Контроль восстановления</h3>
        ${last?html`<p>Последнее наблюдение: <strong>${last.condition==='better'?'Улучшение':last.condition==='worse'?'Ухудшение':last.condition==='good'?'Здоровый вид':'Без изменений'}</strong></p>`:html`<p className="muted">Добавьте минимум два наблюдения в разные дни для сравнения.</p>`}
        ${first&&last?html`<div className="two" style=${{gap:12}}><div><img src=${first.photo} alt="Первое фото" style=${{width:'100%',borderRadius:14}}/><p className="small muted">Первое · ${fmtDate(first.ts)}</p></div><div><img src=${last.photo} alt="Последнее фото" style=${{width:'100%',borderRadius:14}}/><p className="small muted">Последнее · ${fmtDate(last.ts)}</p></div></div>`:null}
        <p className="muted small">Сравнение фотографий визуальное; изменение состояния отмечаете вы сами.</p>
      </section>
    </div>
    <section className="card" style=${{marginTop:24}}><h3>История наблюдений · ${entries.length}</h3>
      ${entries.length?html`<div className="cards">${entries.slice().reverse().map(function(e){return html`<article className="card" key=${e.id} style=${{padding:14}}><img src=${e.photo} alt="Фото наблюдения" style=${{width:'100%',height:170,objectFit:'cover',borderRadius:14}}/><p className="small muted" style=${{marginTop:10}}>${fmtDate(e.ts)}</p><p style=${{fontWeight:600}}>${e.condition==='better'?'Стало лучше':e.condition==='worse'?'Стало хуже':e.condition==='good'?'Здоровый вид':'Без изменений'}</p><p className="muted small">${e.note||'Без заметки'}</p><button className="btn ghost sm" style=${{marginTop:8}} onClick=${function(){removeEntry(e.id);}}>Удалить запись</button></article>`;})}</div>`:html`<p className="muted">Пока нет фотографий. Сохраните первое наблюдение.</p>`}
    </section>`:null}
  </div>`;
}

/* ============ ПРИЛОЖЕНИЕ ============ */
function App() {
  var r = useRoute(), route = r[0], go = r[1];
  var model = useModel();
  var species = useSpeciesModel();
  useEffect(function(){ getIndoorModel().catch(function(){}); },[]);
  var s1 = useState(function () { return store.get('plantai.tomato.rows.v1', []); }), rows = s1[0], setRows = s1[1];
  var s2 = useState(true), storageOk = s2[0], setStorageOk = s2[1];
  useEffect(function () { setStorageOk(store.set('plantai.tomato.rows.v1', rows)); }, [rows]);
  var onSetup = function () { go('diagnosis'); setTimeout(function () { var e = document.getElementById('model-panel'); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80); };
  var page = route === 'home' ? html`<${Home} go=${go} model=${model} />`
    : route === 'diagnosis' ? html`<${Diagnosis} model=${model} species=${species} onSetup=${onSetup} />`
    : route === 'catalog' ? html`<${Catalog} />`
    : route === 'journal' ? html`<${MyPlants} />`
    : route === 'lab' ? html`<${Lab} model=${model} rows=${rows} setRows=${setRows} storageOk=${storageOk} onSetup=${onSetup} />`
    : html`<${About} go=${go} />`;
  return html`<div>
    <${Header} route=${route} go=${go} />
    <main className="wrap page" key=${route}>${page}</main>
    <footer><div className="wrap">© PlantAI · Забота о растениях каждый день</div></footer>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>

</body></html>
